<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookieAI Analytics Test Suite</title>
    <script defer src="/tracker.js" data-site-id="d784536c61515461"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 2rem; border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center; max-width: 500px; }
        h1 { margin-bottom: 1.5rem; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav { display: flex; gap: 1rem; margin-bottom: 2rem; justify-content: center; }
        button { padding: 0.5rem 1rem; border-radius: 0.5rem; border: none; background: #334155; color: white; cursor: pointer; transition: all 0.2s; }
        button:hover { background: #475569; transform: translateY(-2px); }
        button.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
        #status { font-size: 0.9rem; color: #94a3b8; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Analytics Test Site</h1>
        <div class="nav">
            <button onclick="navigate('/')" id="btn-root">Home</button>
            <button onclick="navigate('/about')" id="btn-about">About</button>
            <button onclick="navigate('/contact')" id="btn-contact">Contact</button>
            <button onclick="navigate('/products')" id="btn-products">Products</button>
        </div>
        <div id="content">
            <h2>Current Page: <span id="page-name">Home</span></h2>
            <p>This page simulates an SPA to test the CookieAI analytics tracker.</p>
        </div>
        <div id="status">Waiting for navigation...</div>
    </div>


    <script>
        function navigate(path) {
            console.log("Navigating to:", path);
            history.pushState({}, "", path);
            updateUI();
        }

        function updateUI() {
            const path = window.location.pathname;
            document.getElementById('page-name').innerText = path === '/' ? 'Home' : path.substring(1).charAt(0).toUpperCase() + path.substring(2);
            
            // Update active button
            document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
            if (path === '/') document.getElementById('btn-root').classList.add('active');
            else if (path === '/about') document.getElementById('btn-about').classList.add('active');
            else if (path === '/contact') document.getElementById('btn-contact').classList.add('active');
            else if (path === '/products') document.getElementById('btn-products').classList.add('active');

            document.getElementById('status').innerText = "Last Navigation: " + new Date().toLocaleTimeString();
        }

        // Handle browser back/forward
        window.onpopstate = updateUI;

        // AUTO-SIMULATION (As requested)
        console.log("Starting auto-simulation in 2s...");
        setTimeout(() => navigate('/about'), 2000);
        setTimeout(() => navigate('/contact'), 4000);
        setTimeout(() => navigate('/products'), 6000);
        setTimeout(() => navigate('/'), 8000);
    </script>
</body>
</html>
