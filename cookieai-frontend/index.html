<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme -->
    <meta name="theme-color" content="#6366f1" />

    <!-- SEO -->
    <title>CookieAI – Privacy-first Analytics</title>
    <meta
      name="description"
      content="CookieAI is a modern, privacy-first analytics platform for tracking real-time user behavior."
    />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" />

    <!-- 🔥 PERFORMANCE: FONT OPTIMIZED -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- 🔥 BASE STYLES -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        width: 100%;
        overflow: auto;
        background: #f8fafc;
        color: #0f172a;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      /* 🔥 PREMIUM LOADING SCREEN */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        gap: 12px;
        color: #64748b;
        font-size: 14px;
      }

      #root:empty::before {
        content: "";
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #e2e8f0;
        border-top-color: #6366f1;
        animation: spin 0.8s linear infinite;
      }

      #root:empty::after {
        content: "Loading CookieAI...";
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
