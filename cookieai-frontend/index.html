<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport (mobile safe) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#6366f1" />

    <!-- SEO -->
    <title>CookieAI – Privacy-first Analytics</title>
    <meta
      name="description"
      content="CookieAI is a modern, privacy-first analytics platform for tracking real-time user behavior."
    />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" />

    <!-- Fonts (optimized) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Base Styles + Loader -->
    <style>
      /* RESET */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        width: 100%;
        overflow-x: hidden;
        background: #f8fafc;
        color: #0f172a;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ===== PREMIUM LOADER (RELIABLE) ===== */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        background: #f8fafc;
        z-index: 9999;
        font-size: 14px;
        color: #64748b;
      }

      .loader-ring {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid #e2e8f0;
        border-top-color: #6366f1;
        animation: spin 0.8s linear infinite;
      }

      .loader-text {
        font-weight: 500;
        letter-spacing: 0.3px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* smooth fade out when React mounts */
      .loader-hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
    </style>
  </head>

  <body>
    <!-- LOADER -->
    <div id="app-loader">
      <div class="loader-ring"></div>
      <div class="loader-text">Loading CookieAI</div>
    </div>

    <!-- ROOT -->
    <div id="root"></div>

    <!-- SCRIPT -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- REMOVE LOADER AFTER APP LOAD -->
    <script>
      window.addEventListener("load", () => {
        const loader = document.getElementById("app-loader");
        if (loader) {
          loader.classList.add("loader-hidden");
          setTimeout(() => loader.remove(), 300);
        }
      });
    </script>
  </body>
</html>
