<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#6366f1" />

    <!-- SEO -->
    <title>CookieAI – Privacy-first Analytics</title>
    <meta
      name="description"
      content="CookieAI is a modern, privacy-first analytics platform."
    />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- BASE + LOADER -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        width: 100%;
        background: #f8fafc;
        color: #0f172a;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        height: 100%;
      }

      /* ===== LOADER ===== */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        background: #f8fafc;
        z-index: 9999;
        font-size: 14px;
        color: #64748b;
      }

      .loader-ring {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid #e2e8f0;
        border-top-color: #6366f1;
        animation: spin 0.7s linear infinite;
      }

      .loader-text {
        font-weight: 500;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ===== OFFLINE STATE ===== */
      .offline {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .offline-icon {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid #ef4444;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        color: #ef4444;
      }

      .offline-text {
        font-size: 13px;
        color: #475569;
      }

      /* fade out */
      .loader-hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
    </style>
  </head>

  <body>

    <!-- LOADER -->
    <div id="app-loader">
      <div class="loader-ring"></div>
      <div class="loader-text">Loading CookieAI</div>
    </div>

    <!-- ROOT -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <!-- SCRIPT -->
    <script>
      const loader = document.getElementById("app-loader");

      /* ===== OFFLINE HANDLING ===== */
      function showOffline() {
        loader.innerHTML = `
          <div class="offline">
            <div class="offline-icon">!</div>
            <div class="offline-text">No internet connection</div>
          </div>
        `;
      }

      function showLoading() {
        loader.innerHTML = `
          <div class="loader-ring"></div>
          <div class="loader-text">Loading CookieAI</div>
        `;
      }

      function checkConnection() {
        if (!navigator.onLine) {
          showOffline();
        } else {
          showLoading();
        }
      }

      window.addEventListener("offline", showOffline);
      window.addEventListener("online", showLoading);

      checkConnection();

      /* ===== REMOVE LOADER AFTER APP LOAD ===== */
      window.addEventListener("load", () => {
        if (navigator.onLine) {
          loader.classList.add("loader-hidden");
          setTimeout(() => loader.remove(), 300);
        }
      });
    </script>

  </body>
</html>
